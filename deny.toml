# cargo-deny configuration for MOOMOO-OPEND-TradeStation
# Enforces supply-chain security, bans vulnerable cryptographic routines and undeclared network libraries,
# verifies licenses, and blocks malicious third-party dependencies.

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

# --- Security Advisories (RustSec Vulnerability Database) ---
[advisories]
unmaintained = "none"
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0387: crypto-bigint timing side-channel via transitive alloy-primitives
    { id = "RUSTSEC-2026-0387", reason = "Timing side-channel in crypto-bigint via transitive alloy-primitives; non-critical for local terminal" },
]

# --- License Compliance ---
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "BSL-1.0",
    "MPL-2.0",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]
exceptions = []

[licenses.private]
ignore = true

# --- Banned Crates: Vulnerable Crypto & Undeclared Network Libraries ---
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

# Strict list of prohibited libraries to protect the supply chain:
deny = [
    # Banned vulnerable / obsolete cryptographic routines:
    { crate = "md5", reason = "MD5 is cryptographically broken; use SHA-256 or BLAKE3" },
    { crate = "des", reason = "DES and 3DES are insecure legacy ciphers" },
    { crate = "rc4", reason = "RC4 is cryptographically broken" },
    { crate = "blowfish", reason = "Blowfish has 64-bit block size vulnerabilities" },
    { crate = "openssl-sys", reason = "Unvetted native C OpenSSL bindings are prohibited; pure Rust rustls is enforced" },

    # Banned undeclared / remote access / rogue networking libraries:
    { crate = "curl", reason = "Unauthorized C-based HTTP client; all networking is restricted to loopback OpenD" },
    { crate = "curl-sys", reason = "Native libcurl is prohibited" },
    { crate = "ssh2", reason = "SSH protocol is prohibited under security policy" },
    { crate = "libssh2-sys", reason = "Native SSH library is prohibited" },
    { crate = "ftp", reason = "FTP protocol is prohibited" },
    { crate = "suppaftp", reason = "FTP protocol is prohibited" },
    { crate = "telnet", reason = "Telnet protocol is prohibited" },
    { crate = "lettre", reason = "SMTP/email dispatching is prohibited under private desktop policy" },
    { crate = "smtp", reason = "SMTP protocol is prohibited" },
    { crate = "isahc", reason = "Unauthorized alternative HTTP engine" },
]

# --- Allowed Registries & Sources ---
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[package]
name = "tr-moomoo"
description = "Hardened local Moomoo OpenD client with loopback firewall and watchlist gatekeeper"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
keywords = ["moomoo", "opend", "market-data", "security", "firewall"]
categories = ["finance", "network-programming"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"
url = "2"
sha1 = "0.10"


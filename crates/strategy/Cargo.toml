[package]
name = "tr-strategy"
description = "Quantitative DRBT-Grid strategy engine, next-bar backtester, and autonomous paper trading bot"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
keywords = ["algorithmic-trading", "backtesting", "strategy-optimization", "quantitative-finance"]
categories = ["finance", "science"]

[dependencies]
tr-core = { path = "../core" }
tr-moomoo = { path = "../moomoo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rand = "0.9"

name: Security & Supply-Chain Audit

on:
  push:
    branches: [ master, main ]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain-lock:
    name: Dependency Supply-Chain Lock (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
